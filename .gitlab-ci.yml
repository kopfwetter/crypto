# Prüft bei jedem Push: Testvektoren gegen WebCrypto und noble, und dass vectors.json zu generate.py passt
stages: [test]

vectors:
  stage: test
  image: node:22-slim
  script:
    - npm ci --ignore-scripts --no-audit --no-fund
    - npm run check

generate:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -q -r requirements.txt
    - python3 vectors/generate.py | diff -u vectors/vectors.json -
